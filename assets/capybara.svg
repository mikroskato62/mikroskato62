<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 75" width="100%" height="75">
  <defs>
    <style>
      .walker {
        animation: walkAcross 12s linear infinite;
      }

      .bobbing {
        animation: capyBob 0.5s ease-in-out infinite alternate;
      }

      .leg-front-near {
        transform-origin: 52px 44px;
        animation: legSwing 0.5s ease-in-out infinite alternate;
      }

      .leg-back-near {
        transform-origin: 22px 44px;
        animation: legSwingBack 0.5s ease-in-out infinite alternate;
      }

      .leg-front-far {
        transform-origin: 46px 44px;
        animation: legSwingBack 0.5s ease-in-out infinite alternate;
      }

      .leg-back-far {
        transform-origin: 16px 44px;
        animation: legSwing 0.5s ease-in-out infinite alternate;
      }

      .orange {
        transform-origin: 56px 14px;
        animation: orangeWiggle 0.5s ease-in-out infinite alternate;
      }

      .back-btn {
        cursor: pointer;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .back-btn:hover {
        filter: brightness(1.15);
      }

      @keyframes walkAcross {
        0% {
          transform: translateX(-120px);
        }
        100% {
          transform: translateX(850px);
        }
      }

      @keyframes capyBob {
        0% {
          transform: translateY(0px);
        }
        100% {
          transform: translateY(-2.5px);
        }
      }

      @keyframes legSwing {
        0% {
          transform: rotate(18deg);
        }
        100% {
          transform: rotate(-18deg);
        }
      }

      @keyframes legSwingBack {
        0% {
          transform: rotate(-18deg);
        }
        100% {
          transform: rotate(18deg);
        }
      }

      @keyframes orangeWiggle {
        0% {
          transform: rotate(-5deg);
        }
        100% {
          transform: rotate(5deg);
        }
      }
    </style>
  </defs>

  <!-- 1. WALKING CAPYBARA (Walks in background behind the button) -->
  <g class="walker">
    <g transform="translate(0, 10)">
      <!-- Far legs (in shadow) -->
      <g class="leg-back-far">
        <rect x="13" y="32" width="6.5" height="18" rx="3" fill="#5A3215"/>
        <ellipse cx="17" cy="50" rx="4" ry="2" fill="#3D200B"/>
      </g>
      <g class="leg-front-far">
        <rect x="43" y="32" width="6.5" height="18" rx="3" fill="#5A3215"/>
        <ellipse cx="47" cy="50" rx="4" ry="2" fill="#3D200B"/>
      </g>

      <!-- Main Body and Head that bobs -->
      <g class="bobbing">
        <!-- Body -->
        <path d="M 12 36 
                 C 8 32, 8 20, 16 16 
                 C 22 13, 35 14, 46 16 
                 C 49 16, 52 18, 54 22 
                 L 54 36 
                 C 54 40, 48 41, 40 41 
                 L 20 41 
                 C 14 41, 12 39, 12 36 Z" 
              fill="#8B572A"/>

        <!-- Subtle Body Highlight/Texture -->
        <path d="M 17 18 C 24 15, 36 15, 44 18 C 42 22, 38 23, 30 23 C 22 23, 18 20, 17 18 Z" 
              fill="#9C6433" opacity="0.6"/>

        <!-- Capybara Head -->
        <!-- Typical blunt, blocky snout -->
        <path d="M 44 19 
                 C 44 13, 47 9, 53 8 
                 L 64 8 
                 C 68 8, 70 11, 71 14 
                 L 72 23 
                 C 72 27, 69 29, 65 29 
                 L 53 29 
                 C 48 29, 45 25, 44 19 Z" 
              fill="#8B572A"/>

        <!-- Snout shading / Muzzle -->
        <path d="M 62 13 
                 C 66 13, 70 14, 71 17 
                 L 72 23 
                 C 72 27, 69 29, 65 29 
                 L 59 29 
                 C 61 24, 61 17, 62 13 Z" 
              fill="#6E401B"/>

        <!-- Nostril / Nose -->
        <ellipse cx="69" cy="18" rx="2" ry="1.5" fill="#2E1708"/>

        <!-- Chill closed eye (-.-) -->
        <path d="M 55 15 Q 57.5 13.5 60 15" stroke="#2E1708" stroke-width="1.8" stroke-linecap="round" fill="none"/>

        <!-- Ear -->
        <ellipse cx="47" cy="8.5" rx="3.5" ry="4.5" fill="#6E401B"/>
        <ellipse cx="47" cy="8.5" rx="2" ry="3" fill="#44230C"/>

        <!-- Yuzu / Little Orange on Head -->
        <g class="orange">
          <circle cx="56" cy="4" r="4.2" fill="#FFA500"/>
          <!-- Leaf -->
          <path d="M 56 0.5 C 57 -2, 60 -1, 59 1 Z" fill="#4CAF50"/>
          <!-- Highlight on fruit -->
          <circle cx="54.5" cy="2.5" r="1.2" fill="#FFD54F" opacity="0.8"/>
        </g>
      </g>

      <!-- Near legs (in foreground) -->
      <g class="leg-back-near">
        <rect x="20" y="32" width="7" height="19" rx="3.5" fill="#75441E"/>
        <ellipse cx="24.5" cy="51" rx="4.5" ry="2" fill="#4A270E"/>
      </g>
      <g class="leg-front-near">
        <rect x="49" y="32" width="7" height="19" rx="3.5" fill="#75441E"/>
        <ellipse cx="53.5" cy="51" rx="4.5" ry="2" fill="#4A270E"/>
      </g>
    </g>
  </g>

  <!-- 2. CENTERED "BACK ⇧ TOP" BUTTON (Rendered in foreground on top of the Capybara) -->
  <g id="back-to-top-btn" class="back-btn" transform="translate(400, 37.5)">
    <!-- Drop Shadow onto Capybara and background -->
    <rect x="-61" y="-15" width="122" height="30" rx="6" fill="#000000" opacity="0.55"/>
    <!-- Button Base Body -->
    <rect class="btn-body" x="-60" y="-16" width="120" height="30" rx="5" fill="#00526F" stroke="#008BB8" stroke-width="1.2"/>
    <!-- Top inner highlight bevel -->
    <line x1="-56" y1="-14.5" x2="56" y2="-14.5" stroke="#33BBE8" stroke-width="0.8" opacity="0.6"/>
    <!-- Button Text -->
    <text x="0" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">BACK  ⇧  TOP</text>
  </g>
</svg>
