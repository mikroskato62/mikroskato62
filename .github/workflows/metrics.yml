name: Generate Metrics
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout repository.
        uses: actions/checkout@v4
      - name: 2. Create dist directory.
        run: mkdir -p dist
      - name: 3. Generate arcade games.
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 4. Generate more arcade games.
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          games: 'pacman,breakout,puzzle-bobble,minesweeper'
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: 5. Move arcade games to dist.
        run: |
          shopt -s nullglob
          for file in *-contribution-graph*.svg; do
            mv -f "$file" dist/
          done
          echo "Files in dist:"
          ls -la dist/
      - name: 6. Generate top languages.
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=333&langs_count=10&theme=dracula&hide_border=false&count_private=true&title_color=ffffff&custom_title=RIP%27s%20Top%2010%20Most%20Used%20Languages
          path: dist/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: 7. Push to output branch.
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}